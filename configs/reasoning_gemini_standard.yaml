# Paper evaluation client; the shared server uses config.yaml.
retriever:
  url: http://127.0.0.1:8000
  timeout_s: 600
llm:
  gemini31pro_vertex:
    provider: gemini_vertex
    region: global
    model: gemini-3.1-pro-preview-customtools
    thinking_level: HIGH
    enable_google_search: false
    top_p: 1.0
    max_tokens: 65536
    seed: 20260806
    timeout_s: 3600
    max_retries: 3
reasoning:
  search_top_k: 50
  filter_max_docs: 50
  output_top_k: 100
  big_loop: 3
  branch_budget: 2
  parallelism: 3
  sketch_llm: gemini31pro_vertex
  filter_llm: gemini31pro_vertex
  judge_llm: gemini31pro_vertex
graph:
  graph_augment: false
  reranker_required: true
  rank_fusion: none
  artifact_dir: data/graph/dep_only
  initial_top_n: 50
  graph_expand_m: 200
  final_top_k: 100
